name: Track A distribution validation

on:
  pull_request:
    paths:
      - 'api/dashboard/distribution.js'
      - 'api/dashboard/profile.js'
      - 'growth.html'
      - 'growth.js'
      - 'data/dashboard-nav.js'
      - 'lib/distribution-kit.js'
      - 'tests/distribution-kit.test.js'
      - '.github/workflows/track-a-distribution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run distribution tests
        run: node --test tests/distribution-kit.test.js
      - name: Check distribution JavaScript syntax
        run: |
          node --check api/dashboard/distribution.js
          node --check api/dashboard/profile.js
          node --check lib/distribution-kit.js
          node --check growth.js
